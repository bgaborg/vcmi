name: Quest Build

# Android arm64 APK for Meta Quest 3 (application ID is.xyz.vcmi.quest).
# Signed with the daily key from CI/android, so the fork needs no secrets.
# Steps mirror the android-64 job of github.yml.

# Manual, and weekly on upstream: the scheduled run rebases `quest` on vcmi/vcmi `develop` inside the runner and builds,
# so a conflict or a broken build shows up early. Nothing is pushed; the real rebase stays a manual step.
# Schedules run from the default branch, which is `quest` on the fork.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PRESET: android-conan-ninja-release
  GRADLE_PROPERTIES: vcmiQuest=true;applicationIdSuffix=.quest;applicationLabel=VCMI Quest;applicationVariant=quest;signingConfig=dailySigning

jobs:
  build:
    name: Build (android-quest)
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: ${{ github.event_name == 'schedule' && '0' || '1' }} # quoted: a bare 0 is falsy and would always give 1

    - name: Rebase on upstream develop (weekly run)
      if: github.event_name == 'schedule'
      run: |
        git config user.name "quest rebase check"
        git config user.email "quest-rebase@localhost"
        git fetch https://github.com/vcmi/vcmi.git develop
        git rebase FETCH_HEAD
        git submodule update --init --recursive

    - name: Free up disk space
      run: |
        sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/dotnet || :

    - name: Install Conan Dependencies
      run: |
        pipx install conan
        source '${{ github.workspace }}/CI/install_conan_dependencies.sh' dependencies-android-arm64-v8a

    - name: Setup compiler cache
      uses: step-security/ccache-action@v1
      with:
        variant: ccache
        key: android-quest-${{ github.ref_name }}
        restore-keys: |
          android-quest-
        create-symlink: true
        max-size: '5G'
        job-summary: ""

    - name: CCache tuning
      run: |
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        ccache --set-config=compiler_check=content
        ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
        ccache --set-config=hash_dir=true
        ccache --set-config=sloppiness=time_macros

    - name: Install Conan profile
      run: |
        conan profile detect
        conan install . \
          --output-folder=conan-generated \
          --build=never \
          --profile=dependencies/conan_profiles/android-64-ndk \
          --conf="tools.cmake.cmaketoolchain:generator=Ninja" \
          --profile=dependencies/conan_profiles/base/android-system

    # Can't be set in Gradle project
    - name: Configure enableUncompressedNativeLibs
      run: mkdir -p ~/.gradle && echo "android.bundle.enableUncompressedNativeLibs=true" > ~/.gradle/gradle.properties

    - name: Install Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Number
      run: |
        source '${{ github.workspace }}/CI/get_package_name.sh'
        echo VCMI_PACKAGE_FILE_NAME="$VCMI_PACKAGE_FILE_NAME-quest-arm64-v8a" >> $GITHUB_ENV
        echo VCMI_PACKAGE_BUILD="$VCMI_PACKAGE_BUILD" >> $GITHUB_ENV
        echo VCMI_PACKAGE_NAME_SUFFIX="$VCMI_PACKAGE_NAME_SUFFIX" >> $GITHUB_ENV
        echo VCMI_PACKAGE_GOLDMASTER="$VCMI_PACKAGE_GOLDMASTER" >> $GITHUB_ENV
        echo VCMI_PACKAGE_UPDATE_CHANNEL="$VCMI_PACKAGE_UPDATE_CHANNEL" >> $GITHUB_ENV

    - name: Export Godot XR host
      run: quest/tools/export-xr.sh

    - name: Godot extension
      run: quest/tools/make-extension.sh

    - name: Configure
      run: |
        cmake --preset "$PRESET" \
          -DENABLE_CCACHE:BOOL=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          "-DANDROID_GRADLE_PROPERTIES=$GRADLE_PROPERTIES"

    - name: Build
      run: cmake --build --preset "$PRESET"

    - name: Find Android package
      run: |
        buildDir="${{ github.workspace }}/out/build/$PRESET"
        mv "$buildDir/android-build/vcmi-app/build/outputs/apk/release/vcmi-release.apk" "$buildDir/$VCMI_PACKAGE_FILE_NAME.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: ${{ github.workspace }}/out/build/${{ env.PRESET }}/${{ env.VCMI_PACKAGE_FILE_NAME }}.apk
