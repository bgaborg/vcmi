// Sprite to canvas; border = white die-cut paper edge (pop-up book look)
function spriteCanvas(def, ppu, border){
  const pad = border ? 7 : 0;
  const W = Math.ceil(def.w*ppu)+pad*2, H = Math.ceil(def.h*ppu)+pad*2;
  const s = document.createElement('canvas'); s.width=W; s.height=H;
  const sg = s.getContext('2d'); sg.translate(pad,pad); sg.scale(ppu,ppu); def.draw(sg);
  if(!border) return s;
  const w = document.createElement('canvas'); w.width=W; w.height=H;
  const wg = w.getContext('2d'); wg.drawImage(s,0,0); wg.globalCompositeOperation='source-in'; wg.fillStyle='#f4ecd8'; wg.fillRect(0,0,W,H);
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const g = c.getContext('2d');
  for(let a=0;a<16;a++) g.drawImage(w, Math.cos(a/16*Math.PI*2)*pad*0.8, Math.sin(a/16*Math.PI*2)*pad*0.8);
  g.drawImage(s,0,0);
  return c;
}
// Standing paper card, pivot at bottom edge
function makeCard(def, widthM){
  const c = spriteCanvas(def, Math.round(320/Math.max(def.w,def.h)), true);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const hM = widthM*c.height/c.width;
  const geo = new THREE.PlaneGeometry(widthM, hM); geo.translate(0, hM/2, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({map:t, alphaTest:0.5, side:THREE.DoubleSide, roughness:0.9}));
  m.castShadow = true;
  const pivot = new THREE.Group(); pivot.add(m);
  return pivot;
}

// ---------- shared adventure map data (same map on screen and on table) ----------
const COLS=24, ROWS=16;
function terrainAt(x,y){
  if(Math.hypot((x-4)/4.5,(y-4)/3.2)<1) return 'water';
  if(Math.hypot((x-19)/4,(y-12)/3)<1) return 'swamp';
  if(Math.hypot((x-13)/3,(y-3)/2.5)<1) return 'rough';
  return 'grass';
}
const fogAt = (x,y) => x >= 19 + Math.floor(hash(7,y)*2) - (y<3?1:0);

const ROAD  = [[5.5,10.0],[7,10.5],[9.5,10.5],[11.5,9.5],[12.5,8.5],[15.5,7.5],[15.5,6.2]];

     .map(([x,y,k])=>[k,x,y,k==='tree'?1.0:0.85]),

function drawTerrain(g,cols,rows,tp){
  const pal = {grass:['#4f8a2e','#58933a','#47812b'], water:['#1d5a92','#2163a0','#1b5288'], swamp:['#3d5838','#46613f','#38522f'], rough:['#8b6e45','#967a52','#7f6440']};
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    const t = terrainAt(x,y), p = pal[t];
    g.fillStyle = p[Math.floor(hash(x,y)*p.length)]; g.fillRect(x*tp, y*tp, tp+1, tp+1);
    for(let i=0;i<4;i++){
      const sx = x*tp + hash(x,y,i+1)*tp, sy = y*tp + hash(x,y,i+9)*tp;
      if(t==='water'){ g.fillStyle='rgba(255,255,255,0.18)'; g.fillRect(sx,sy,tp*0.25,tp*0.04); }
      else { g.fillStyle='rgba(0,0,0,0.12)'; g.beginPath(); g.arc(sx,sy,tp*0.06,0,7); g.fill(); }
    }
  }
  g.fillStyle='#cdb67a'; const s = tp*0.14;
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
    if(terrainAt(x,y)==='water') continue;
    if(terrainAt(x-1,y)==='water') g.fillRect(x*tp,y*tp,s,tp);
    if(terrainAt(x+1,y)==='water') g.fillRect((x+1)*tp-s,y*tp,s,tp);
    if(terrainAt(x,y-1)==='water') g.fillRect(x*tp,y*tp,tp,s);
    if(terrainAt(x,y+1)==='water') g.fillRect(x*tp,(y+1)*tp-s,tp,s);
  }
  const line = (pts,col,w,dash)=>{ g.save(); g.strokeStyle=col; g.lineWidth=w; g.lineCap='round'; g.lineJoin='round'; if(dash) g.setLineDash(dash);
    g.beginPath(); pts.forEach(([px,py],i)=> i?g.lineTo(px*tp,py*tp):g.moveTo(px*tp,py*tp)); g.stroke(); g.restore(); };
  line(RIVER,'#2a6fb5',tp*0.32); line(RIVER,'#5aa0dd',tp*0.1,[tp*0.3,tp*0.4]);
  line(ROAD,'#9c7b4c',tp*0.38); line(ROAD,'#c2a070',tp*0.22,[tp*0.2,tp*0.15]);
}

const RES = [['#8a5a2a','12'],['#c0c0d0','4'],['#707070','10'],['#e0d040','3'],['#e04040','5'],['#40a0e0','6'],['#f2c230','14 500']];
function drawResources(g,W,H){
  g.fillStyle='#2a1c0e'; g.fillRect(0,0,W,H); g.strokeStyle='#c9a24a'; g.lineWidth=4; g.strokeRect(3,3,W-6,H-6);
  const date='Month 1, Week 2, Day 3', pad=16;
  g.textBaseline='middle';
  // shrink font until resources + date fit side by side
  let f=Math.round(H*0.42), widths, total, dw;
  for(;;){
    g.font=`bold ${f}px Georgia`;
    const icon=f*1.1, gap=f*0.9;
    widths = RES.map(([,v])=>icon+g.measureText(v).width+gap);
    total = widths.reduce((a,b)=>a+b,0); dw = g.measureText(date).width;
    if(pad+total+dw+pad <= W || f<=8) break;
    f--;
  }
  const r=f*0.42; let x=pad;
  RES.forEach(([c,v],i)=>{ g.fillStyle=c; g.beginPath(); g.arc(x+r,H/2,r,0,7); g.fill();
    g.fillStyle='#f3e3b0'; g.fillText(v,x+f*1.1,H/2); x+=widths[i]; });
  g.fillStyle='#f3e3b0'; g.textAlign='right'; g.fillText(date,W-pad,H/2); g.textAlign='left';
}

// Classic flat adventure UI = what VCMI renders today
function drawScreen(g,W,H){
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  g.save(); g.translate(8,8); g.beginPath(); g.rect(0,0,1024,672); g.clip();
  drawTerrain(g,32,21,32);
  for(const o of OBJ){ const d=SPR[o[0]], wpx=o[3]*32, c=spriteCanvas(d,wpx/d.w,false); g.drawImage(c,(o[1]+0.5)*32-wpx/2,(o[2]+1)*32-c.height); }
  PATH.forEach(([x,y],i)=>{ g.fillStyle = i===PATH.length-1 ? '#d02020' : '#30d030'; g.beginPath(); g.arc((x+0.5)*32,(y+0.5)*32,5,0,7); g.fill(); });
  g.fillStyle='#000'; for(let y=0;y<21;y++) for(let x=0;x<32;x++) if(fogAt(x,y)) g.fillRect(x*32,y*32,33,33);
  g.restore();
  const px=1040; g.fillStyle='#3a2a16'; g.fillRect(px,0,240,H); g.strokeStyle='#c9a24a'; g.lineWidth=3; g.strokeRect(px+4,4,232,H-8);
  g.save(); g.translate(px+12,12); g.scale(216/32,144/21); drawTerrain(g,32,21,1);
  g.fillStyle='#000'; for(let y=0;y<21;y++) for(let x=0;x<32;x++) if(fogAt(x,y)) g.fillRect(x,y,1.05,1.05);
  g.strokeStyle='#fff'; g.lineWidth=0.3; g.strokeRect(2,3,14,10); g.restore();
  const heroes=[['G','#4a6fb5'],['O','#b5704a'],['S','#7a4ab5']];
  heroes.forEach(([n,c],i)=>{ const y=170+i*62; g.fillStyle=c; g.fillRect(px+14,y,56,56); g.strokeStyle='#c9a24a'; g.strokeRect(px+14,y,56,56);
    g.fillStyle='#fff'; g.font='bold 28px Georgia'; g.fillText(n,px+32,y+38);
    g.fillStyle='#2a8f2a'; g.fillRect(px+72,y+56*i*0.3,6,56*(1-i*0.3)); g.fillStyle='#2a5fd0'; g.fillRect(px+80,y+56*i*0.2,6,56*(1-i*0.2)); });
  [0,1].forEach(i=>{ const y=170+i*62; g.fillStyle='#5a4428'; g.fillRect(px+150,y,72,56); g.drawImage(spriteCanvas(SPR.castle,26,false),px+160,y+2); });
  const btns=['Kingdom','Under','Quests','Sleep','Move','Spells','Options','End turn'];
  g.font='bold 15px Georgia'; g.textAlign='center';
  btns.forEach((b,i)=>{ const x=px+14+(i%2)*108, y=380+Math.floor(i/2)*60; g.fillStyle='#4a3218'; g.fillRect(x,y,104,52); g.strokeStyle='#c9a24a'; g.strokeRect(x,y,104,52); g.fillStyle='#f3e3b0'; g.fillText(b,x+52,y+31); });
  g.textAlign='left';
  g.fillStyle='#120c06'; g.fillRect(px+14,628,212,80); g.fillStyle='#f3e3b0'; g.font='15px Georgia'; g.fillText('Gerwulf, Knight',px+24,654); g.fillText('Movement: 1400',px+24,678);
  g.save(); g.translate(0,682); drawResources(g,1032,38); g.restore();
}

function stoneTex(rx,ry,bw,bh){
  const t = tex(512,512,(g,w,h)=>{ g.fillStyle='#2a241e'; g.fillRect(0,0,w,h);
    for(let r=0;r<h/bh;r++) for(let c=-1;c<w/bw+1;c++){ const x=c*bw-(r%2?bw/2:0), y=r*bh, v=55+hash(c,r)*30|0;
      g.fillStyle=`rgb(${v+18},${v+10},${v})`; g.fillRect(x+3,y+3,bw-6,bh-6); } });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx,ry); return t;
}

for(const [k,x] of [['hero',-0.74],['heroRed',0.74]]){ const pv=makeCard(SPR[k],0.13); pv.position.set(x,0,-0.25); battleGroup.add(pv); battlePops.push({o:pv,d:0.2}); }
const activeRing = new THREE.Mesh(new THREE.RingGeometry(0.032,0.038,6,1,Math.PI/6), new THREE.MeshBasicMaterial({color:0xffe040, transparent:true}));
activeRing.rotation.x=-Math.PI/2; activeRing.position.copy(hexW(1,5)).add(new THREE.Vector3(0,0.002,0)); battleGroup.add(activeRing);
const targetRing = new THREE.Mesh(new THREE.RingGeometry(0.032,0.038,6,1,Math.PI/6), new THREE.MeshBasicMaterial({color:0xff4040, transparent:true}));
targetRing.rotation.x=-Math.PI/2; targetRing.position.copy(hexW(15,4)).add(new THREE.Vector3(0,0.002,0)); battleGroup.add(targetRing);
const arrow = new THREE.Group(); { const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.0015,0.0015,0.05,6), new THREE.MeshStandardMaterial({color:0x6b4423})); shaft.rotation.x=Math.PI/2; arrow.add(shaft);
  const tip=new THREE.Mesh(new THREE.ConeGeometry(0.004,0.01,6), new THREE.MeshStandardMaterial({color:0xcccccc})); tip.rotation.x=Math.PI/2; tip.position.z=0.028; arrow.add(tip); }
battleGroup.add(arrow);
const arrowA = hexW(1,5).add(new THREE.Vector3(0.02,0.05,0)), arrowB = hexW(15,4).add(new THREE.Vector3(0,0.04,0));
const boomTex = tex(128,128,(g)=>{ const gr=g.createRadialGradient(64,64,4,64,64,64); gr.addColorStop(0,'rgba(255,255,200,1)'); gr.addColorStop(0.4,'rgba(255,140,30,0.9)'); gr.addColorStop(1,'rgba(255,40,0,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); });
const boom = new THREE.Sprite(new THREE.SpriteMaterial({map:boomTex, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false}));
boom.position.copy(hexW(14,7)).add(new THREE.Vector3(0,0.06,0)); battleGroup.add(boom);
const battleBar = uiPanel(0.9,0.075,1024,85,(g,W,H)=>{ g.fillStyle='#2a1c0e'; g.fillRect(0,0,W,H); g.strokeStyle='#c9a24a'; g.lineWidth=4; g.strokeRect(3,3,W-6,H-6);
  g.textBaseline='middle'; const btn=(x,w,t)=>{ g.fillStyle='#4a3218'; g.fillRect(x,12,w,H-24); g.strokeStyle='#c9a24a'; g.lineWidth=2; g.strokeRect(x,12,w,H-24);
    g.fillStyle='#f3e3b0'; let fs=Math.round(H*0.26); do { g.font=`bold ${fs--}px Georgia`; } while(g.measureText(t).width > w-10 && fs>8);
    g.textAlign='center'; g.fillText(t,x+w/2,H/2); };
  ['Options','Surrender','Flee','Auto'].forEach((t,i)=>btn(12+i*86,80,t));
  g.fillStyle='#120c06'; g.fillRect(360,12,380,H-24); g.fillStyle='#f3e3b0'; g.textAlign='left'; g.font=`${Math.round(H*0.24)}px Georgia`;
  g.fillText('Archers shoot Skeletons. 7 perish.',372,H*0.36); g.fillText('Red Dragon is hit by Fireball.',372,H*0.66);
  ['Spells','Wait','Defend'].forEach((t,i)=>btn(752+i*88,82,t)); });
battleBar.position.set(0,0.05,0.53); battleBar.rotation.x=-0.7; battleGroup.add(battleBar);
const spellbook = uiPanel(0.2,0.125,512,320,(g,W,H)=>{ g.fillStyle='#e8d8b0'; g.fillRect(0,0,W,H);
  const gr=g.createLinearGradient(W/2-30,0,W/2+30,0); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(0.5,'rgba(60,30,0,0.5)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(W/2-30,0,60,H);
  g.strokeStyle='#5a1a14'; g.lineWidth=12; g.strokeRect(0,0,W,H);
  [['Fireball','#e05020'],['Haste','#40a0e0'],['Bless','#f2c230'],['Slow','#8060c0'],['Lightning','#a0c0ff'],['Cure','#40c060']].forEach(([n,c],i)=>{
    const x = i<3 ? 30 : W/2+30, y = 40+(i%3)*90; g.fillStyle=c; g.beginPath(); g.arc(x+30,y+30,28,0,7); g.fill(); g.strokeStyle='#3a2a1a'; g.lineWidth=3; g.stroke();
    g.fillStyle='#3a2a1a'; g.font='24px Georgia'; g.fillText(n,x+68,y+38); }); });
spellbook.position.set(0.86,0.14,0.28); spellbook.rotation.set(-0.6,-0.5,0,'YXZ'); battleGroup.add(spellbook);

// ---------- world anchor: table follows the head in VR and AR ----------
const world = new THREE.Group(); scene.add(world);
world.add(room, base, screenGroup, sun, sun.target);
const EYE = new THREE.Vector3(0,1.2,0);   // design eye point, looking -z
let recenterIn = -1;
// Table top 0.45 m below eyes, facing head yaw. Room floor and legs stay on the
// real floor only if the runtime floor looks valid (seated or standing eye height).
function recenter(){
  const xrCam = renderer.xr.getCamera();
  const p = new THREE.Vector3(), q = new THREE.Quaternion();
  xrCam.matrixWorld.decompose(p, q, new THREE.Vector3());
  const dir = new THREE.Vector3(0,0,-1).applyQuaternion(q);
  world.rotation.set(0, Math.atan2(-dir.x,-dir.z), 0);
  world.position.copy(p).sub(EYE);
  const dy = world.position.y, floorOk = p.y >= 1.0 && p.y <= 2.1;
  room.position.y = floorOk ? -dy : 0;
  setLegBottom(floorOk ? -TABLE_Y-dy : -0.78);
}
function resetWorld(){ world.position.set(0,0,0); world.rotation.set(0,0,0); room.position.y=0; setLegBottom(-0.78); }

// ---------- XR controllers ----------
for(let i=0;i<2;i++){
  const c = renderer.xr.getController(i);
  c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0,0,-3)]), new THREE.LineBasicMaterial({color:0xffe08a})));
  c.addEventListener('squeezestart', ()=>cycleMode());
  c.addEventListener('selectstart', ()=>recenter());
  scene.add(c);
}
renderer.xr.addEventListener('sessionstart', ()=>{
  const s = renderer.xr.getSession();
  if(s.environmentBlendMode && s.environmentBlendMode !== 'opaque'){ room.visible=false; scene.background=null; }
  recenterIn=10;
  renderer.xr.getReferenceSpace()?.addEventListener('reset', ()=>{ recenterIn=5; });   // Meta button long-press recenter
  ctrl.visible=laser.visible=cursor.visible=false;
});
renderer.xr.addEventListener('sessionend', ()=>{
  recenterIn=-1; resetWorld();
  room.visible=true; scene.background=BG; ctrl.visible=laser.visible=cursor.visible=true;
});

// ---------- modes ----------
const MODES=['screen','table','battle'];
let mode='table', modeStart=0;
const VIEWS = { screen:[[0,1.25,0.6],[0,1.4,-2.0]], table:[[0,1.5,0.15],[0,0.78,-0.8]], battle:[[0,1.45,0.1],[0,0.78,-0.8]] };
function setMode(m){
  mode=m; modeStart=clock.getElapsedTime();
  screenGroup.visible = closedBook.visible = m==='screen';
  tableGroup.visible = m==='table'; battleGroup.visible = m==='battle';
  for(const p of [...tablePops,...battlePops]) p.o.rotation.x=-Math.PI/2;
  document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  if(!renderer.xr.isPresenting){ camera.position.set(...VIEWS[m][0]); controls.target.set(...VIEWS[m][1]); }
}
const cycleMode = () => setMode(MODES[(MODES.indexOf(mode)+1)%MODES.length]);
document.querySelectorAll('#ui button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
addEventListener('keydown', e=>{ const i='123'.indexOf(e.key); if(i>=0) setMode(MODES[i]); });
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const qm = new URLSearchParams(location.search).get('mode');   // ?mode=screen|table|battle
setMode(MODES.includes(qm) ? qm : 'table');

// ---------- loop ----------
const heroRoute = [[9,10],...PATH];
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(()=>{
  const t = clock.getElapsedTime(), lt = t - modeStart;
  if(recenterIn > 0 && --recenterIn === 0) recenter();   // wait for a valid head pose
  for(const {flame,pl} of flames){ const f = 0.85 + 0.15*Math.sin(t*13+pl.position.x*9)*Math.sin(t*7.3); pl.intensity=1.2*f; flame.scale.set(1,1.8*f,1); }

  const pops = mode==='table' ? tablePops : mode==='battle' ? battlePops : [];
  for(const p of pops){ const k=Math.min(1,Math.max(0,(lt-p.d)/0.7)); p.o.rotation.x = -Math.PI/2*(1-easeOutBack(k)); }

  if(mode==='screen'){
    const th = Math.PI + 0.3*Math.sin(t*0.6), y = SCR_Y + 0.3*Math.sin(t*0.9), r = R_SCR-0.02;
    cursor.position.set(r*Math.sin(th), y, r*Math.cos(th));
    const a = laserGeo.attributes.position; a.setXYZ(0, ctrl.position.x, ctrl.position.y, ctrl.position.z); a.setXYZ(1, cursor.position.x, cursor.position.y, cursor.position.z); a.needsUpdate=true;
  }
  if(mode==='table'){
    for(const f of fogs) f.position.y = MAP_Y + 0.09 + 0.006*Math.sin(t*0.7+f.userData.ph);
    const walk = lt-2.5; let passed=0;
    if(walk>0 && heroPivot){
      const u = Math.min(1,(walk%8)/6), f = u*(heroRoute.length-1), i = Math.min(heroRoute.length-2,Math.floor(f)), fr = f-i;
      const a = tileBase(...heroRoute[i]), b = tileBase(...heroRoute[i+1]);
      heroPivot.position.lerpVectors(a,b,fr); heroPivot.position.y += Math.abs(Math.sin(fr*Math.PI))*0.006*(u<1?1:0);
      passed = Math.floor(f);
    }
    pathDiscs.forEach((d,i)=>{ d.visible = i>=passed; d.scale.setScalar(1+0.25*Math.max(0,Math.sin(t*4-i*0.7))); });
    sandTop.scale.setScalar(0.6+0.4*((Math.sin(t*0.3)+1)/2)); sandBot.scale.setScalar(1.4-0.4*((Math.sin(t*0.3)+1)/2));
  }
  if(mode==='battle'){
    activeRing.material.opacity = 0.5+0.5*Math.sin(t*5); targetRing.material.opacity = 0.5+0.5*Math.sin(t*5+Math.PI);
    const s = ((t%2.6)-0.3)/1.4;
    arrow.visible = s>=0 && s<=1 && lt>1.5;
    if(arrow.visible){
      const pos = (q)=> tmp.lerpVectors(arrowA,arrowB,q).add(new THREE.Vector3(0,Math.sin(Math.PI*q)*0.18,0)).clone();
      arrow.position.copy(pos(s)); arrow.lookAt(battleGroup.localToWorld(pos(Math.min(1,s+0.02))));
    }
    const bt = (t%3.2)/0.9; boom.visible = bt<1 && lt>1.5;
    if(boom.visible){ boom.scale.setScalar(0.05+0.2*bt); boom.material.opacity = 1-bt; }
  }
  if(!renderer.xr.isPresenting) controls.update();
  renderer.render(scene,camera);
});
</script>
